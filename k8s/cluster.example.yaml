# eksctl create cluster -f k8s/cluster.example.yaml     (edit name/region; use the same values in your commands)
# 2 x t3.large (8 GB each) hold Kafka + 2 Java services + auth + frontend (+ in-cluster Postgres).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: etp-cluster
  region: ap-south-1
managedNodeGroups:
  - name: workers
    instanceType: t3.large
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
    privateNetworking: true
iam:
  withOIDC: true
addons:
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
