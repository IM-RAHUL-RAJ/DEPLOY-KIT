server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/blotter, /admin/...) are served the app, which routes them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles never change; index.html must always be re-read.
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
